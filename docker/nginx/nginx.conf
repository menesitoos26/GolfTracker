events {
    worker_connections 1024;
}

http {
    # Redirige todo HTTP a HTTPS
    server {
        listen 80;
        server_name golftrackertfg.duckdns.org;
        return 301 https://$host$request_uri;
    }

    # Servidor HTTPS principal
    server {
        listen 443 ssl;
        server_name golftrackertfg.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/golftrackertfg.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/golftrackertfg.duckdns.org/privkey.pem;

        # API
        location /api/ {
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend
        location / {
            proxy_pass http://frontend:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}